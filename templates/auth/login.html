{% extends "base.html" %}

{% block title %}Admin Login — ELECHUB{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-slate-200/80">
        <!-- Brand Header -->
        <div class="text-center">
            <div class="mx-auto w-16 h-16 rounded-2xl overflow-hidden shadow-xl shadow-cyan-500/30 mb-4 border border-cyan-500/30">
                <img src="{{ url_for('static', filename='icons/icon-192.png') }}" class="w-full h-full object-cover" alt="ELECHUB">
            </div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">ELECHUB</h2>
            <p class="mt-1 text-sm text-cyan-600 font-semibold">Campus Campaign Command Center</p>
        </div>

        <!-- Login Form -->
        <form class="mt-8 space-y-6" method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Admin Master Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <input id="password" name="password" type="password" required autofocus
                        placeholder="Enter administrator password"
                        class="block w-full pl-10 pr-10 py-3 text-slate-900 placeholder-slate-400 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 text-sm transition">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-cyan-600">
                        <i id="eye-icon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <div>
                <button type="submit"
                    class="w-full flex justify-center items-center space-x-2 py-3 px-4 border border-transparent rounded-xl text-sm font-bold text-slate-950 bg-cyan-400 hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-cyan-500 shadow-lg shadow-cyan-500/30 transition">
                    <span>Unlock Command Center</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </form>

        <div class="pt-4 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-400">
                Authorized campaign staff only. Protected by session credentials.
            </p>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
